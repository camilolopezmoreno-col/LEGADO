<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    background: #11161b;
    color: #e8edf2;
    font-family: Arial, sans-serif;
}

.merge-section {
    margin: 0;
    padding: 20px;
}

.merge-frame {
    display: block;
    width: 100%;
    height: 75vh;
    border: 0;
    background: white;
}

.merge-grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(360px, 1fr));
    gap: 16px;
    padding: 16px;
}

.slide {
    display: none;
}

.slide.active {
    display: block;
}

.controls {
    text-align: center;
    padding: 12px;
}

.controls button,
.tabs button {
    padding: 8px 14px;
    margin: 3px;
    cursor: pointer;
}

.tab-content {
    display: none;
}

.tab-content.active {
    display: block;
}

.accordion button {
    display: block;
    width: 100%;
    padding: 14px;
    text-align: left;
    background: #202830;
    color: #ffffff;
    border: 1px solid #39444e;
    cursor: pointer;
}

.accordion-panel {
    display: none;
}

.index-list {
    padding: 16px;
}

.index-list a {
    display: block;
    padding: 10px 0;
    color: #8cc8ff;
    text-decoration: none;
}

</style>

<button onclick="prevSlide()">Previous</button>

<script>

let slideIndex = 0;

const slides =
    document.querySelectorAll(".slide");

function showSlide(index) {

    if (!slides.length) {
        return;
    }

    slideIndex =
        (index + slides.length) %
        slides.length;

    slides.forEach(
        (slide, i) => {

            slide.classList.toggle(
                "active",
                i === slideIndex
            );

        }
    );
}

function nextSlide() {
    showSlide(slideIndex + 1);
}

function prevSlide() {
    showSlide(slideIndex - 1);
}

</script>
