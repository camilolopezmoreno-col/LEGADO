    <style>

        <p>1949 — 1953</p>
    </div>
</body>

<body>

<main class="checklist">

  <h1>Leiste el libro?</h1>

  <div class="check-item">
    <input type="checkbox" id="pineapple-0">
    <label for="pineapple-0">Eres familiar?</label>
  </div>

  <div class="check-item">
    <input type="checkbox" id="pineapple-1">
    <label for="pineapple-1">leiste ek libro?</label>
  </div>

  <div class="check-item">
    <input type="checkbox" id="pineapple-2">
    <label for="pineapple-2">conoces la.editorial?</label>
  </div>

  <div class="check-item">
    <input type="checkbox" id="pineapple-3">
    <label for="pineapple-3">sabes donde comprarlo?</label>
  </div>

  <div class="check-item">
    <input type="checkbox" id="pineapple-4">
    <label for="pineapple-4">sabes de su existencia?</label>
  </div>

  <div class="check-item">
    <input type="checkbox" id="pineapple-5">
    <label for="pineapple-5">comprarias un ejemplar?</label>
  </div>


  <div id="counter">0 de 6 completados</div>

</main>

<script>
(function(){

  "use strict";

  /* ==========================================
     SINCRONIZACIÓN COMPARTIDA
     ========================================== */

  var KEY = "experienceChecklist66.v1";

  var DEFAULTS = {
    "love.experiment": false,

    "pineapple.0": false,
    "pineapple.1": false,
    "pineapple.2": false,
    "pineapple.3": false,
    "pineapple.4": false,
    "pineapple.5": false,

  };

  function get(){

    try{

      return Object.assign(
        {},
        DEFAULTS,
        JSON.parse(localStorage.getItem(KEY) || "{}")
      );

    }catch(e){

      return Object.assign({}, DEFAULTS);

    }

  }

  function set(id,value){

    var state = get();

    state[id] = !!value;

    try{
      localStorage.setItem(
        KEY,
        JSON.stringify(state)
      );
    }catch(e){}

    window.dispatchEvent(
      new Event("experienceChecklist66-sync")
    );

  }

  /*
    API compartida con los otros HTML
  */

  window.ExperienceChecklist = {
    key: KEY,
    get: get,
    set: set
  };


  /* ==========================================
     CHECKBOXES DE PIÑA
     ========================================== */

  var checkboxes = [];

  for(var i = 0; i < 6; i++){

    var checkbox =
      document.getElementById("pineapple-" + i);

    checkboxes.push(checkbox);

    checkbox.addEventListener("change",function(){

      var index =
        checkboxes.indexOf(this);

      ExperienceChecklist.set(
        "pineapple." + index,
        this.checked
      );

      update();

    });

  }


  /* ==========================================
     ACTUALIZAR INTERFAZ
     ========================================== */

  function update(){

    var state =
      ExperienceChecklist.get();

    var count = 0;

    checkboxes.forEach(function(checkbox,index){

      var checked =
        !!state["pineapple." + index];

      checkbox.checked = checked;

      if(checked){
        count++;
      }

    });

    document.getElementById("counter").textContent =
      count + " de 6 completados";

  }


  /* ==========================================
     ESCUCHAR CAMBIOS DE LOS OTROS HTML
     ========================================== */

  window.addEventListener(
    "experienceChecklist66-sync",
    update
  );


  /* Cambios realizados desde otra pestaña */
  window.addEventListener(
    "storage",
    function(e){

      if(e.key === KEY){

        window.dispatchEvent(
          new Event("experienceChecklist66-sync")
        );

      }

    }
  );


  /* Estado inicial */
  update();

})();
</script>

</body>

</html>
